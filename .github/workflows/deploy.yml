name: Deploy frontend

on:
  push:
    branches:
      - master

jobs:
  run-tests:
    uses: ./.github/workflows/unit-tests.yml 
  deploy:
    runs-on: self-hosted
    needs: run-tests
    steps:
      - name: Проверяем статус
        run: echo "Тесты завершились со статусом ${{ needs.run-tests.outputs.test_result }}"
      - name: Pull and Restart Docker Containers
        run: |
          cd /home/pi/projects/retrospective/retrospective-app 
          
          git pull
          
          cd ..

          make up

          docker image prune -f

      - name: Deploy notify 
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          socks5: ${{secrets.SOCKS5_PROXY}}
          message: |
            Деплой.
            Статус деплоя: ${{ job.status == 'success' && '✅ Успешно' || '❌ Ошибка' }}
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}
            Автор: ${{ github.actor }}
            Посмотреть: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
